<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>OpenMazelingo Web Prototype</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main class="shell">
    <header>
      <p class="eyebrow">OpenMazelingo</p>
      <h1>Text mixer prototype</h1>
      <p class="muted">テキストをチャンク翻訳して日英ペアをキャッシュし、決定論的にごちゃ混ぜ表示します。</p>
    </header>

    <section class="panel">
      <label for="sourceText">Input text</label>
      <textarea id="sourceText" rows="12" placeholder="日本語またはEnglishのテキストを貼り付け"></textarea>

      <div class="controls">
        <label>Mode
          <select id="mode">
            <option value="both">Both</option>
            <option value="ja-en">JA → EN</option>
            <option value="en-ja">EN → JA</option>
          </select>
        </label>
        <label>Mix ratio
          <input id="mixRatio" type="range" min="0" max="100" value="30" />
          <span id="mixRatioValue">30%</span>
        </label>
        <label>Chunk chars
          <input id="chunkSize" type="number" min="200" max="4000" step="100" value="900" />
        </label>
      </div>

      <div class="actions">
        <button id="generate">Generate</button>
        <button id="remix" class="secondary" disabled>Remix cached text</button>
        <button id="downloadCache" class="secondary" disabled>Download cache JSON</button>
      </div>
      <p id="status" class="status"></p>
    </section>

    <section class="panel">
      <div class="result-head">
        <h2>Mixed result</h2>
        <span id="cacheInfo" class="muted"></span>
      </div>
      <article id="result" class="result"></article>
    </section>

    <section class="panel note">
      <h2>Prototype translator</h2>
      <p>Chrome の Translator API が使える環境ではオンデバイス翻訳します。使えない場合は原文をそのまま返し、キャッシュ・チャンク化・mix処理だけを確認できます。</p>
      <p>TTS / OpenAI-compatible API は次段階で adapter として追加する前提です。</p>
    </section>
  </main>
  <script type="module" src="./app.js"></script>
</body>
</html>
